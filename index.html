<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Datos de transferencia</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
<div id="vw" hidden><div class="vc" id="vc"></div></div>
<div id="ed" hidden>
  <header class="top"><div class="logo">💸 Transferencias</div>
    <select id="sel" class="tb" aria-label="Mis tarjetas"></select>
    <button id="new" class="tb" type="button">Nueva</button>
    <button id="save" class="tb pr" type="button">💾 Guardar</button>
    <button id="del" class="tb" type="button">Borrar</button></header>
  <div class="split">
    <section class="panel">
      <label for="t">Título</label><input id="t" class="in" maxlength="80" placeholder="Ej: Transferencia Jair">
      <label for="p">Foto de perfil (URL, opcional)</label><input id="p" class="in" placeholder="https://…/foto.jpg">
      <label for="raw">Pega aquí los datos</label>
      <textarea id="raw" class="in" maxlength="4000" placeholder="Nombre: Juan Pérez&#10;RUT: 12.345.678-9&#10;Banco: Banco Estado&#10;Tipo de cuenta: Cuenta Vista&#10;N° de cuenta: 12345678&#10;Correo: juan@correo.cl"></textarea>
      <p class="hint">Una línea por dato. Lo que va antes de «:» es el nombre del dato y lo de después, el valor que se copia.</p>
      <label>Enlace para el NFC</label>
      <div class="lk"><span id="lk"></span><button id="cl" class="tb" type="button">Copiar</button><button id="op" class="tb" type="button">Abrir</button></div>
      <p class="hint">El enlace no cambia al modificar y volver a guardar.</p>
    </section>
    <section class="stage"><div class="pvh">Vista previa en vivo</div><div class="phone"><div class="dk"><div class="vc" id="pv"></div></div></div></section>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){'use strict';
const API='https://datostransfer.jairletelier23.workers.dev?x=1';
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;};
const g=k=>{try{return localStorage.getItem(k)}catch(e){return null}},st=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200);}
function legacy(t){const a=document.createElement('textarea');a.value=t;a.readOnly=true;a.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(a);a.select();a.setSelectionRange(0,99999);let ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(a);if(!ok)throw 0;}
function copyText(t){return new Promise((res,rej)=>{const fb=()=>{try{legacy(t);res()}catch(e){rej(e)}};if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(res,fb);else fb();});}
function doCopy(text,btn,msg){const o=btn.dataset.o||(btn.dataset.o=btn.textContent);copyText(text).then(()=>{btn.classList.add('ok');btn.textContent='✓ Copiado';toast(msg||'Copiado');setTimeout(()=>{btn.classList.remove('ok');btn.textContent=o;},1400);}).catch(()=>toast('No se pudo copiar'));}
function parse(raw){return String(raw||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{const c=l.replace(/^[-•*·▪●]+\s*/,''),m=c.match(/^([^:：]{1,40}?)\s*[:：]\s*(.*)$/);return(m&&!/^\/\//.test(m[2]))?{l:m[1].trim(),v:m[2].trim()}:{l:'',v:c};});}
const KINDS=[['tipo',/tipo/i],['rut',/rut|dni|ident|c[eé]dula/i],['banco',/banco/i],['mail',/mail|correo/i],['tel',/tel|cel|fono|whats/i],['nombre',/nombre|titular/i],['cuenta',/cuenta|cta|n[°º]|n[uú]mero/i],['monto',/monto|valor|precio/i]];
const LABELS={tipo:'Tipo de cuenta',rut:'RUT',banco:'Banco',mail:'Correo',tel:'Teléfono',nombre:'Nombre',cuenta:'N° de cuenta',monto:'Monto'};
const ICON={
nombre:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
rut:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6 16c.5-1.500 1.800-2 3-2s2.500.5 3 2M15 10h3M15 14h3"/>',
banco:'<path d="M3 10l9-6 9 6"/><path d="M5 10v8M9.500 10v8M14.500 10v8M19 10v8M3 20h18"/>',
tipo:'<rect x="2.500" y="5" width="19" height="14" rx="2"/><path d="M2.500 10h19M6 15h4"/>',
cuenta:'<path d="M5 9h15M4 15h15M10 3L8 21M16 3l-2 18"/>',
mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
tel:'<rect x="7" y="2.500" width="10" height="19" rx="2"/><path d="M11 18h2"/>',
monto:'<path d="M12 5v14M15.500 9c-.6-1-1.700-1.600-3.500-1.600-2 0-3.300 1-3.300 2.400s1.300 2 3.300 2.300c2 .3 3.300 1 3.300 2.400s-1.300 2.500-3.300 2.500c-1.800 0-3-.7-3.600-1.700"/>',
otro:'<path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.500" cy="7.500" r="1.200"/>'};
const svg=k=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(ICON[k]||ICON.otro)+'</svg>';
const kindOfLabel=l=>{for(const[k,re]of KINDS)if(re.test(l))return k;return 'otro';};
function guess(v,seen){
  if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))return 'mail';
  if(/^\d{1,2}\.\d{3}\.\d{3}-?[\dkK]$/.test(v)||/^\d{7,8}-[\dkK]$/.test(v))return 'rut';
  if(/^\$\s?[\d.,]+$/.test(v))return 'monto';
  if(/^(\+\s?56[\s\d-]{8,}|9[\s-]?\d{4}[\s-]?\d{4})$/.test(v))return 'tel';
  if(/^(cuenta|cta\.?)\s|^(vista|corriente|ahorro|chequera)\b/i.test(v))return 'tipo';
  if(/\b(banco|santander|scotia|bice|security|falabella|ripley|consorcio|copec|tenpo|mercado\s?pago|coopeuch|bbva|prepago)|\b(bci|mach|tapp)\b|\bita[uú]/i.test(v))return 'banco';
  if(/^\d[\d\s-]{5,}$/.test(v))return 'cuenta';
  return seen.nombre?'otro':'nombre';
}
function render(box,d){
  box.innerHTML='';
  const pu=(d.p||'').trim();
  if(pu){const av=el('div','av'),im=document.createElement('img');av.appendChild(el('span','',(d.t||'?').trim().charAt(0).toUpperCase()));im.alt='';im.referrerPolicy='no-referrer';im.onload=()=>{im.style.display='block'};im.onerror=()=>im.remove();im.src=/^(https?:\/\/|data:image\/)/i.test(pu)?pu:'https://'+pu;av.appendChild(im);box.appendChild(av);}
  box.appendChild(el('h1','',d.t||'Datos de transferencia'));box.appendChild(el('div','sub','Datos de transferencia'));
  const items=parse(d.raw);if(!items.length){box.appendChild(el('p','ld','Sin datos todavía'));return;}
  const list=el('div','list'),seen={};
  items.forEach((it,i)=>{
    if(it.l&&!it.v){list.appendChild(el('div','hd',it.l));return;}
    let k,lab;if(it.l){k=kindOfLabel(it.l);lab=it.l;}else{k=guess(it.v,seen);lab=LABELS[k]||'Dato';}
    seen[k]=1;
    const r=el('div','row'),m=el('div','m'),ic=el('span','ic');r.style.setProperty('--i',i);ic.innerHTML=svg(k);
    r.appendChild(ic);m.appendChild(el('small','',lab));m.appendChild(el('b','',it.v));r.appendChild(m);
    const b=el('button','cp','Copiar');b.type='button';b.onclick=()=>doCopy(it.v,b);r.appendChild(b);list.appendChild(r);
  });
  box.appendChild(list);box.appendChild(el('p','tip','Toca «Copiar» en cada dato o usa «Copiar todo»'));
  const all=el('button','all','Copiar todo');all.type='button';all.onclick=()=>doCopy(d.raw,all,'¡Todo copiado!');box.appendChild(all);
}
const q=new URLSearchParams(location.search),qid=q.get('id');
if(qid&&!q.has('edit')){
  document.body.className='v';document.documentElement.className='v';$('#vw').hidden=false;const box=$('#vc');box.appendChild(el('p','ld','Cargando…'));
  fetch(API+'&id='+encodeURIComponent(qid)+'&t='+Date.now()).then(r=>r.json()).then(j=>{if(!j.ok)throw 0;document.title=j.data.t||'Transferencia';render(box,j.data);}).catch(()=>{box.innerHTML='';box.appendChild(el('p','ld','No se encontró esta tarjeta.'));});
  return;
}
$('#ed').hidden=false;
let list=[],cur={id:'',t:'',raw:'',p:''};
const base=()=>location.protocol==='file:'?location.href.split(/[?#]/)[0]:location.origin+location.pathname.replace(/index\.html$/,'');
const link=()=>cur.id?base()+'?id='+cur.id:'';
const mk=t=>(t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,12)||'t')+'-'+Array.from(crypto.getRandomValues(new Uint8Array(5))).map(x=>(x%36).toString(36)).join('');
function api(method,id,body){return fetch(API+(id?'&id='+encodeURIComponent(id):'')+'&t='+Date.now(),{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined}).then(r=>r.json()).then(j=>{if(!j.ok)throw new Error(j.error||'Error');return j;});}
function drawSel(){const s=$('#sel');s.innerHTML='';const o0=el('option','','Mis tarjetas ('+list.length+')');o0.value='';s.appendChild(o0);list.forEach(c=>{const o=el('option','',c.t||c.id);o.value=c.id;if(c.id===cur.id)o.selected=true;s.appendChild(o);});}
function draw(){render($('#pv'),cur);$('#lk').textContent=link()?link().replace(/^https?:\/\//,''):'Guarda la tarjeta para generar el enlace';}
function setCur(c){cur={id:c.id||'',t:c.t||'',raw:c.raw||'',p:c.p||''};$('#t').value=cur.t;$('#p').value=cur.p;$('#raw').value=cur.raw;draw();drawSel();}
function dirty(){const s=list.find(x=>x.id===cur.id);return s?(s.t!==cur.t.trim()||s.raw!==cur.raw||(s.p||'')!==cur.p):!!(cur.t||cur.raw||cur.p);}
function sync(){api('GET','').then(j=>{list=j.items||[];drawSel();}).catch(e=>toast(e.message));}
function onIn(){cur.t=$('#t').value;cur.raw=$('#raw').value;cur.p=$('#p').value.trim();draw();if(!cur.id)st('tr-draft',JSON.stringify(cur));}
let pT;$('#t').oninput=onIn;$('#raw').oninput=onIn;$('#p').oninput=()=>{cur.p=$('#p').value.trim();if(!cur.id)st('tr-draft',JSON.stringify(cur));clearTimeout(pT);pT=setTimeout(draw,600);};
$('#sel').onchange=e=>{const c=list.find(x=>x.id===e.target.value);if(!c){drawSel();return;}if(dirty()&&!confirm('Hay cambios sin guardar. ¿Cargar otra tarjeta?')){drawSel();return;}setCur(c);};
$('#new').onclick=()=>{if(dirty()&&!confirm('Hay cambios sin guardar. ¿Empezar una nueva?'))return;st('tr-draft','');setCur({});};
$('#save').onclick=()=>{
  if(!cur.t.trim())return toast('Escribe un título');if(!cur.raw.trim())return toast('Pega los datos');
  const id=cur.id||mk(cur.t),b=$('#save'),it={id,t:cur.t.trim(),raw:cur.raw,p:cur.p};b.disabled=true;b.textContent='Guardando…';
  api('POST',id,{t:it.t,raw:it.raw,p:it.p}).then(()=>{cur.id=id;const i=list.findIndex(x=>x.id===id);if(i<0)list.unshift(it);else list[i]=it;st('tr-draft','');drawSel();draw();toast('¡Guardado!');}).catch(e=>toast('Error: '+e.message)).then(()=>{b.disabled=false;b.textContent='💾 Guardar';});
};
$('#del').onclick=()=>{
  if(!cur.id){if(cur.t||cur.raw){if(confirm('¿Descartar esta tarjeta sin guardar?')){st('tr-draft','');setCur({});}}else toast('Elige una tarjeta guardada');return;}
  if(!confirm('¿Borrar "'+cur.t+'"?\nSu enlace dejará de funcionar.'))return;
  api('DELETE',cur.id).then(()=>{list=list.filter(x=>x.id!==cur.id);setCur({});toast('Tarjeta borrada');}).catch(e=>toast('Error: '+e.message));
};
$('#cl').onclick=()=>link()?doCopy(link(),$('#cl'),'Enlace copiado'):toast('Primero guarda la tarjeta');
$('#op').onclick=()=>link()?window.open(link(),'_blank'):toast('Primero guarda la tarjeta');
if(qid){fetch(API+'&id='+encodeURIComponent(qid)+'&t='+Date.now()).then(r=>r.json()).then(j=>{if(j.ok)setCur({id:qid,t:j.data.t,raw:j.data.raw,p:j.data.p});}).catch(()=>{});}
else{try{const d=JSON.parse(g('tr-draft')||'null');if(d)setCur(d);else setCur({});}catch(e){setCur({});}}
sync();
})();
</script>
</body>
</html>
